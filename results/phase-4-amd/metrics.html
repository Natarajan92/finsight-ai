<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    #vis.vega-embed {
      width: 100%;
      display: flex;
    }

    #vis.vega-embed details,
    #vis.vega-embed details summary {
      position: relative;
    }
  </style>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega@6"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega-lite@6.4.1"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega-embed@7"></script>
</head>
<body>
  <div id="vis"></div>
  <script>
    (function(vegaEmbed) {
      var spec = {"config": {"view": {"continuousWidth": 300, "continuousHeight": 300}}, "data": {"values": [{"arm": "A", "metric": "all_gold_pages_at_5", "value": 1.0, "measured_cases": 1}, {"arm": "A", "metric": "candidate_pool_coverage", "value": 1.0, "measured_cases": 1}, {"arm": "A", "metric": "document_recall_at_5", "value": 1.0, "measured_cases": 1}, {"arm": "A", "metric": "gold_page_recall_at_5", "value": 1.0, "measured_cases": 1}, {"arm": "A", "metric": "mrr_at_15", "value": 1.0, "measured_cases": 1}, {"arm": "A", "metric": "page_hit_at_5", "value": 1.0, "measured_cases": 1}, {"arm": "A", "metric": "retained_context_gold_page_recall", "value": 1.0, "measured_cases": 1}]}, "mark": {"type": "bar"}, "encoding": {"color": {"field": "arm", "type": "nominal"}, "tooltip": [{"field": "arm", "type": "nominal"}, {"field": "metric", "type": "nominal"}, {"field": "value", "type": "quantitative"}, {"field": "measured_cases", "type": "quantitative"}], "x": {"field": "metric", "title": "Measured retrieval / integrity proxy", "type": "nominal"}, "xOffset": {"field": "arm", "type": "nominal"}, "y": {"field": "value", "scale": {"domain": [0, 1]}, "title": "Mean", "type": "quantitative"}}, "height": 320, "title": "AMD development pilot \u2014 measured proxies", "width": 640, "$schema": "https://vega.github.io/schema/vega-lite/v6.4.1.json"};
      var embedOpt = {"mode": "vega-lite"};

      function showError(el, error){
          el.innerHTML = ('<div style="color:red;">'
                          + '<p>JavaScript Error: ' + error.message + '</p>'
                          + "<p>This usually means there's a typo in your chart specification. "
                          + "See the javascript console for the full traceback.</p>"
                          + '</div>');
          throw error;
      }
      const el = document.getElementById('vis');
      vegaEmbed("#vis", spec, embedOpt)
        .catch(error => showError(el, error));
    })(vegaEmbed);

  </script>
</body>
</html>
