[build-system]
requires = ["uv_build==0.12.23"]
build-backend = "uv_build"

[project]
name = "finsight-ai"
version = "0.1.0"
description = "Evidence-first financial document intelligence"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    "PyMuPDF==1.28.2",
]

[project.scripts]
finsight-smoke = "finsight.smoke:main"
finsight-ingest = "finsight.ingestion.cli:main"
finsight-benchmark-audit = "finsight.evaluation.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.1"]

[tool.uv.build-backend]
module-name = "finsight"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '-ra --strict-markers -m "not integration"'
markers = ["integration: opt-in local-source or separately authorized provider checks"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
