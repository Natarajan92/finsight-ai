name: Foundation checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  foundation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      UV_LINK_MODE: copy
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, verified 2026-10-18
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, verified 2026-10-18
        with:
          python-version-file: .python-version
      - name: Install pinned uv
        run: python -m pip install uv==0.12.23
      - name: Check lock
        run: uv lock --check
      - name: Install
        run: uv sync --locked --group dev
      - name: Lint
        run: uv run --locked ruff check .
      - name: Formatting
        run: uv run --locked ruff format --check .
      - name: Unit tests (no data, credentials or services)
        run: uv run --locked pytest --basetemp=.pytest_cache/ci
      - name: Synthetic smoke
        run: uv run --locked finsight-smoke
      - name: Package build
        run: uv build
