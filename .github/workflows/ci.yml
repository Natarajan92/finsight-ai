name: Project checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  foundation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      UV_LINK_MODE: copy
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, verified 2026-10-18
      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.23"
          enable-cache: false
      - name: Install pinned Python
        run: uv python install
      - name: Check lock
        run: uv lock --check
      - name: Install
        run: uv sync --locked --group dev
      - name: Lint
        run: uv run --locked ruff check .
      - name: Formatting
        run: uv run --locked ruff format --check .
      - name: Unit tests (no data, credentials or services)
        run: uv run --locked pytest --basetemp "${{ runner.temp }}/finsight-pytest"
      - name: Synthetic smoke
        run: uv run --locked finsight-smoke
      - name: Ingestion command installation
        run: uv run --locked finsight-ingest --help
      - name: Offline benchmark command installation
        run: uv run --locked finsight-benchmark-audit --help
      - name: Package build
        run: uv build
      - name: Baseline RAG command installation
        run: uv run --locked finsight-rag --help
      - name: Synthetic RAG pipeline
        run: uv run --locked finsight-rag smoke --synthetic
